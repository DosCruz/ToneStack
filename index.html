<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tone Stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ToneStack</h1>

        <button id="search-button" aria-label="Search">
            <i class="bi bi-search"></i>
        </button>

        <input
            type="text"
            id="search"
            placeholder="Search songs..."
            hidden
        >
    </header>

    <main>
        <section id="song-list">
            <!--Songs will be loaded here by app.js-->
        </section>

        <section id="song-viewer" hidden>
            <div id="song-controls">
                <div>
                    <button id="back-button">← Song list</button>
                </div>
                <div>
                    <button id="pin-button">Pin</button>
                <button id="display-toggle">Numbers</button>
                </div>
                
            </div>

            <h2 id="song-title"></h2>

            <p id="song-artist"></p>

            <div id="display-options">
                <label for="key-selector">Key:</label>

                <select id="key-selector">
                    <option value="C">C</option>
                    <option value="C#">C#</option>
                    <option value="D">D</option>
                    <option value="D#">D#</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="F#">F#</option>
                    <option value="G">G</option>
                    <option value="G#">G#</option>
                    <option value="A">A</option>
                    <option value="B♭">B♭</option>
                    <option value="B">B</option>
                </select>
            </div>

            <div id="song-sections"></div>

            <div id="singer-keys"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
